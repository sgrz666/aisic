[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edusci-mvp"
version = "0.1.0"
description = "教育智研 AI Scientist MVP backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "redis>=5,<7",
  "rq>=2,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "statsmodels>=0.14,<1",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["edusci*"]

[tool.setuptools.package-data]
edusci = ["dag/templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
  "ignore:Using .*starlette.testclient.*:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
